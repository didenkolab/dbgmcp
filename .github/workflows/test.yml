name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both legs run the whole suite, including the live tests and the backend
    # conformance suite. Delve behaves differently on the two: macOS goes
    # through the gdbserial backend (debugserver), Linux through the native
    # one, and hardware watchpoints are where they diverge most. A capability
    # that holds on one and not the other is exactly what the conformance suite
    # exists to surface, so neither leg is allowed to be the only one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux/amd64
          - os: macos-14
            label: darwin/arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Pinned: the server compiles against this Delve's RPC client, and its own
      # provisioning check refuses a different API series.
      - name: Install Delve
        run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2

      - name: Doctor
        run: go run ./cmd/dbgmcp doctor

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 20m

      # ptrace on Ubuntu runners is unrestricted by default, but say so out loud:
      # a silent change here would look like a debugger bug rather than a
      # sandbox policy.
      - name: Report ptrace scope
        if: runner.os == 'Linux'
        run: cat /proc/sys/kernel/yama/ptrace_scope || echo "yama not present"
