name: test

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. Superseded runs were queueing behind each other for the
# scarce hosted macOS runners, so a push could wait on work already irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both legs run the whole suite, including the live tests and the backend
    # conformance suite. Delve behaves differently on the two: macOS goes
    # through the gdbserial backend (debugserver), Linux through the native
    # one, and hardware watchpoints are where they diverge most. A capability
    # that holds on one and not the other is exactly what the conformance suite
    # exists to surface, so neither leg is allowed to be the only one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux/amd64
          - os: macos-14
            label: darwin/arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    # Defined once so the steps and the completeness check cannot disagree.
    env:
      PKG_PURE: ./internal/model/... ./internal/findings/... ./internal/diffruns/... ./internal/discover/... ./internal/session/... ./internal/backend ./internal/backend/conformance ./cmd/...
      PKG_DELVE: ./internal/backend/delve/...
      PKG_DAP: ./internal/backend/dap/...
      PKG_SERVER: ./internal/mcpserver/... ./internal/tools/...

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Pinned: the server compiles against this Delve's RPC client, and its own
      # provisioning check refuses a different API series.
      - name: Install Delve
        run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2

      # An optional toolchain, fetched so the JavaScript profile is exercised
      # rather than skipped. It is a GitHub release asset, not an npm package.
      - name: Install the JavaScript debug adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.cache/dbgmcp && cd ~/.cache/dbgmcp
          gh release download v1.117.0 -R microsoft/vscode-js-debug \
            -p 'js-debug-dap-*.tar.gz' -O js-debug.tar.gz
          tar xzf js-debug.tar.gz && rm js-debug.tar.gz

      # debugpy for the Python profile, installed into .venv-test because that is
      # exactly where the suite looks for it. An interpreter carrying debugpy
      # anywhere else leaves every Python test skipped -- and a skipped suite
      # reports the same green as a passing one.
      - name: Install debugpy
        run: |
          python3 -m venv .venv-test
          .venv-test/bin/pip install -q debugpy


      - name: Doctor
        run: go run ./cmd/dbgmcp doctor

      - name: Vet
        run: go vet ./...

      # The suite is split by package group, and that is a diagnostic, not tidiness.
      #
      # On macOS a run has been observed wedged past go test's own -timeout and
      # past timeout-minutes as well, ending only when the runner killed the whole
      # job -- and a job killed that way uploads no log at all. Step metadata does
      # survive it. So the group that stays in_progress names where it wedged even
      # when there is nothing to read, which a single step could never do.
      #
      # PKG_* are defined once at job level and checked for completeness below, so
      # a new package cannot quietly fall outside every group.
      - name: Test (pure logic)
        timeout-minutes: 5
        run: go test $PKG_PURE -count=1 -v -timeout 4m

      - name: Test (Go debugger)
        timeout-minutes: 10
        run: go test $PKG_DELVE -count=1 -v -timeout 8m

      - name: Test (DAP adapters)
        timeout-minutes: 12
        run: go test $PKG_DAP -count=1 -v -timeout 10m

      - name: Test (server and tools)
        timeout-minutes: 10
        run: go test $PKG_SERVER -count=1 -v -timeout 8m

      # Runs last and never gates the suite: its only job is to fail loudly if a
      # package exists that no group above would have tested.
      - name: Every package belongs to a group
        if: always()
        run: |
          missing=$(comm -23 <(go list ./... | sort) <(go list $PKG_PURE $PKG_DELVE $PKG_DAP $PKG_SERVER | sort))
          if [ -n "$missing" ]; then
            echo "These packages are in no test group, so they were never run:"
            echo "$missing"
            exit 1
          fi
          echo "every package is covered by a group"

      # ptrace on Ubuntu runners is unrestricted by default, but say so out loud:
      # a silent change here would look like a debugger bug rather than a
      # sandbox policy.
      - name: Report ptrace scope
        if: runner.os == 'Linux'
        run: cat /proc/sys/kernel/yama/ptrace_scope || echo "yama not present"
