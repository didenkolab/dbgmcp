name: release

on:
  push:
    tags: ['v*']
  # Re-runnable by hand against an existing tag. A release whose artifact is
  # missing for one platform should not need the tag moved to try again.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Built on both, because the only way to know the binary works on a platform
    # is to have run the suite there.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install Delve
        run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2

      # An optional toolchain, fetched so the JavaScript profile is exercised
      # rather than skipped. It is a GitHub release asset, not an npm package.
      - name: Install the JavaScript debug adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.cache/dbgmcp && cd ~/.cache/dbgmcp
          gh release download v1.117.0 -R microsoft/vscode-js-debug \
            -p 'js-debug-dap-*.tar.gz' -O js-debug.tar.gz
          tar xzf js-debug.tar.gz && rm js-debug.tar.gz

      # debugpy for the Python profile, installed into .venv-test because that is
      # exactly where the suite looks for it. An interpreter carrying debugpy
      # anywhere else leaves every Python test skipped -- and a skipped suite
      # reports the same green as a passing one.
      - name: Install debugpy
        run: |
          python3 -m venv .venv-test
          .venv-test/bin/pip install -q debugpy

      # Two timeouts, because they fail differently and only one of them keeps
      # the evidence.
      #
      # go test's own -timeout panics the test binary and dumps every goroutine's
      # stack, which names the blocked test. But it does not always end the step:
      # a run has been observed sitting well past it. When that happened without
      # a step timeout, the *runner* eventually killed the whole job, and a job
      # killed that way uploads no log at all -- which is how the macOS leg failed
      # repeatedly while leaving nothing to read.
      #
      # timeout-minutes kills only the step, so the job carries on and the log,
      # with -v naming the last test to start, survives. The suite takes under
      # four minutes on a healthy runner; these are slack, not budgets.
      - name: Test
        timeout-minutes: 15
        run: go test ./... -count=1 -v -timeout 10m
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          out="dbgmcp_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/dbgmcp
          tar czf "$out.tar.gz" "$out"
      - uses: softprops/action-gh-release@v2
        with:
          files: dbgmcp_*.tar.gz
          fail_on_unmatched_files: true
